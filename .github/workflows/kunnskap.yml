name: Kunnskapsbank

# Lørdagsresearchen gjøres av Claude (planlagt oppgave kl. 01:32 norsk tid, med Big J sin Claude-konto).
# Denne arbeidsflyten forbereder den: fredag kl. 23:07 UTC regnes kursmønstrene ut på nytt (ingen KI), og hele
# datagrunnlaget eksporteres til grenen kb-data, som Claude leser. Claudes notater hentes inn av «kunnskap-inn.yml».
#
# Den gamle lesingen med den lokale modellen kan fortsatt startes for hånd: Actions > Kunnskapsbank > Run workflow
# med antall minutter, eller ved å skrive et tall i .github/kunnskap-start.txt. Skriv «data» der for bare eksport.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "«data» for bare eksport, eller maks minutter lesing med lokal modell (inntil 600)"
        type: string
        default: "data"
  schedule:
    - cron: "7 23 * * 5"     # fredag 23:07 UTC: datagrunnlag klart før Claude starter lørdag natt
  push:
    branches: [main]
    paths: [".github/kunnskap-start.txt"]

permissions:
  contents: read

concurrency:
  group: kunnskap
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.t.outputs.data }}
      first: ${{ steps.t.outputs.first }}
      second: ${{ steps.t.outputs.second }}
    steps:
      - uses: actions/checkout@v4
      - name: Velg lesetid
        id: t
        env:
          IN: ${{ inputs.minutes }}
        run: |
          M="$IN"
          if [ "${{ github.event_name }}" = "schedule" ]; then M=data; fi
          if [ "${{ github.event_name }}" = "push" ]; then M=$(head -1 .github/kunnskap-start.txt | grep -Eo '^(data|[0-9]{1,3})'); fi
          if [ "$M" = "data" ]; then
            echo "data=true" >> "$GITHUB_OUTPUT"; echo "first=0" >> "$GITHUB_OUTPUT"; echo "second=0" >> "$GITHUB_OUTPUT"
            echo "Bare egne data og eksport"; exit 0
          fi
          echo "data=false" >> "$GITHUB_OUTPUT"
          if ! echo "$M" | grep -Eq '^[0-9]{1,3}$'; then M=60; fi
          if [ "$M" -gt 600 ]; then M=600; fi
          FIRST=$(( M > 340 ? 340 : M ))
          SECOND=$(( M - FIRST - 25 ))   # 25 minutter går med til oppstart og avslutning, så alt holder seg under 10 timer
          if [ "$SECOND" -lt 20 ]; then SECOND=0; fi
          echo "first=$FIRST" >> "$GITHUB_OUTPUT"
          echo "second=$SECOND" >> "$GITHUB_OUTPUT"
          echo "Del 1: $FIRST min, del 2: $SECOND min (bare hvis det er mer å lese)"

  data:
    needs: plan
    if: needs.plan.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Kursmønstre og eksport
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KNOWLEDGE_SCOPE: data
          KB_DATA_DIR: /tmp/kb-data
        working-directory: collectors
        run: python -u run.py knowledge,export
      - name: Legg datagrunnlaget i grenen kb-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/kb-data
          printf '# Datagrunnlag for Claude\n\nEksportert av arbeidsflyten Kunnskapsbank. Bare markedsdata.\n' > README.md
          git init -q -b kb-data
          git add -A
          git -c user.name=terminal-fc-bot -c user.email=terminal-fc-bot@users.noreply.github.com commit -qm "Datagrunnlag $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" kb-data

  read1:
    needs: plan
    if: needs.plan.outputs.first != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      more: ${{ steps.les.outputs.more }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Hent lokal KI-modell fra cachen
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b-instruct-v1
      - name: Start lokal KI
        run: bash .github/scripts/ollama.sh
      - name: Les (del 1, ${{ needs.plan.outputs.first }} min)
        id: les
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KNOWLEDGE_MINUTES: ${{ needs.plan.outputs.first }}
          KNOWLEDGE_STATE_FILE: /tmp/kb_state
        working-directory: collectors
        run: |
          python -u run.py knowledge
          cat /tmp/kb_state >> "$GITHUB_OUTPUT" 2>/dev/null || echo "more=false" >> "$GITHUB_OUTPUT"

  read2:
    needs: [plan, read1]
    if: always() && needs.read1.outputs.more == 'true' && needs.plan.outputs.second != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt
      - run: pip install -r collectors/requirements.txt
      - name: Hent lokal KI-modell fra cachen
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b-instruct-v1
      - name: Start lokal KI
        run: bash .github/scripts/ollama.sh
      - name: Les videre (del 2, ${{ needs.plan.outputs.second }} min)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KNOWLEDGE_MINUTES: ${{ needs.plan.outputs.second }}
        working-directory: collectors
        run: python -u run.py knowledge
