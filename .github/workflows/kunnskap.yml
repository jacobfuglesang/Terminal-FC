name: Kunnskapsbank

# Den lokale KI-modellen leser om shipping, fraktmarkeder, råvarer og aksjemarkedet og lagrer korte notater.
# Hver lørdag kl. 06:05 norsk tid leser den i 5,5 timer med Groq (hele lørdagens kvote er satt av) og den lokale modellen,
# frisker opp det som handler om situasjonen nå, og skriver sammenfatninger og ukens samfunnsrapport.
# Kan også startes for hånd (Actions > Kunnskapsbank > Run workflow) eller ved å endre .github/kunnskap-start.txt.
# Stopper av seg selv hvis databasen nærmer seg 80 % av gratisgrensen.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Hvor mange minutter den skal lese (maks 330)"
        type: string
        default: "300"
  schedule:
    - cron: "5 5 * * 6"      # hver lørdag 06:05 norsk vintertid (07:05 sommertid)
    - cron: "5 5 24 11 *"    # 24.11.2026 kl. 06:05 norsk tid: stor lesing med Groq (hele dagens kvote) og lokal modell
  push:
    branches: [main]
    paths: [".github/kunnskap-start.txt"]   # endre denne filen for å starte en lang lesing

permissions:
  contents: read

concurrency:
  group: kunnskap
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - run: pip install -r collectors/requirements.txt

      - name: Hent lokal KI-modell fra cachen
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b-instruct-v1

      - name: Start lokal KI
        run: bash .github/scripts/ollama.sh

      - name: Velg lesetid
        id: t
        env:
          IN: ${{ inputs.minutes }}
        run: |
          M="$IN"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            M=330
            if [ "${{ github.event.schedule }}" = "5 5 24 11 *" ]; then
              if [ "$(date -u +%F)" = "2026-11-24" ]; then M=330; else M=0; fi
            fi
          fi
          if [ "${{ github.event_name }}" = "push" ]; then M=$(grep -Eo '^[0-9]{1,3}' .github/kunnskap-start.txt | head -1); fi
          if ! echo "$M" | grep -Eq '^[0-9]{1,3}$'; then M=60; fi
          if [ "$M" -gt 330 ]; then M=330; fi
          echo "minutes=$M" >> "$GITHUB_OUTPUT"

      - name: Les i ${{ steps.t.outputs.minutes }} minutter
        if: steps.t.outputs.minutes != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KNOWLEDGE_MINUTES: ${{ steps.t.outputs.minutes }}
        working-directory: collectors
        run: python -u run.py knowledge
