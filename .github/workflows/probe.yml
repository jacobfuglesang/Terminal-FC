name: Probe
on:
  push:
    branches: [probe]
    paths: [probe/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests openpyxl feedparser yfinance trafilatura googlenewsdecoder lxml_html_clean websockets
      - run: python probe/probe.py
        env:
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Lagre resultater
        run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git add -f probe/ && git commit -m "probe-resultater [skip ci]" && git push
