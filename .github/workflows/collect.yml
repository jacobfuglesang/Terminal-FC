name: Hent data

on:
  schedule:
    # Tidene er i UTC. Oslo er UTC+1 om vinteren og UTC+2 om sommeren.
    - cron: "7,22,37,52 7-15 * * 1-5"   # Kurser hvert 15. min i børstiden (ikke på hel time, da er GitHub travlest)
    - cron: "41 16 * * 1-5"             # Sluttkurs etter børsslutt
    - cron: "33 7 * * 3"                # SSB laksepris onsdag (publiseres 08:00 norsk tid)
    - cron: "13 9 * * *"                # SSB daglig sikkerhetsrunde (fanger forsinkede publiseringer)
    - cron: "27 17 * * *"               # Daglig: short, fôr, biomasse, terminkurve, lus
    - cron: "47 0-6,16-23 * * *"        # Nyheter hver time utenom børstiden
    - cron: "47 7-15 * * 0,6"           # Nyheter hver time i helgene
  push:
    branches: [main]
    paths: ["collectors/**", ".github/workflows/collect.yml"]   # Kjør alt én gang når innsamlerne endres
  workflow_dispatch:
    inputs:
      job:
        description: "Hva skal hentes?"
        type: choice
        options: [all, prices, news, announcements, fundamentals, ssb, daily, shorts, feed, biomass, futures, lice]
        default: all
      backfill:
        description: "Hent lang historikk (første gang)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - run: pip install -r collectors/requirements.txt

      - name: Velg jobb
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "job=all" >> "$GITHUB_OUTPUT"
            echo "flags=--backfill" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.backfill }}" = "true" ]; then echo "flags=--backfill" >> "$GITHUB_OUTPUT"; fi
          else
            case "${{ github.event.schedule }}" in
              "33 7 * * 3"|"13 9 * * *") echo "job=ssb" >> "$GITHUB_OUTPUT" ;;
              "27 17 * * *") echo "job=daily,announcements,news" >> "$GITHUB_OUTPUT" ;;
              "47 0-6,16-23 * * *"|"47 7-15 * * 0,6") echo "job=announcements,news" >> "$GITHUB_OUTPUT" ;;
              *) echo "job=prices,announcements,news" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Hent ${{ steps.pick.outputs.job }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        working-directory: collectors
        run: |
          set -o pipefail
          python -u run.py ${{ steps.pick.outputs.job }} ${{ steps.pick.outputs.flags }} 2>&1 | tee ../run.log

      # Ved kodeendringer: lagre loggen i grenen run-log, så den kan leses uten å logge inn på GitHub
      - name: Lagre logg
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/log && cp run.log /tmp/log/run.log 2>/dev/null || echo "ingen logg" > /tmp/log/run.log
          echo "${{ github.sha }} $(date -u)" > /tmp/log/meta.txt
          git config user.name "fuglesang-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan run-log
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore 2>/dev/null || true
          cp /tmp/log/* .
          git add run.log meta.txt
          git commit -qm "logg [skip ci]"
          git push -f origin run-log
