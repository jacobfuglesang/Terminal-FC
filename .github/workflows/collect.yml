name: Hent data

on:
  schedule:
    # Tidene er i UTC. Oslo er UTC+1 om vinteren og UTC+2 om sommeren.
    - cron: "7,22,37,52 7-15 * * 1-5"   # Kurser hvert 15. min i børstiden (ikke på hel time, da er GitHub travlest)
    - cron: "41 16 * * 1-5"             # Sluttkurs etter børsslutt
    - cron: "33 7 * * 3"                # SSB laksepris onsdag (publiseres 08:00 norsk tid)
    - cron: "13 9 * * *"                # SSB daglig sikkerhetsrunde (fanger forsinkede publiseringer)
    - cron: "27 17 * * *"               # Daglig: short, fôr, biomasse, terminkurve, lus
  push:
    branches: [main]
    paths: ["collectors/**"]   # Kjør alt én gang når innsamlerne endres
  workflow_dispatch:
    inputs:
      job:
        description: "Hva skal hentes?"
        type: choice
        options: [all, prices, ssb, daily, shorts, feed, biomass, futures, lice]
        default: all
      backfill:
        description: "Hent lang historikk (første gang)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - run: pip install -r collectors/requirements.txt

      - name: Velg jobb
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "job=all" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.backfill }}" = "true" ]; then echo "flags=--backfill" >> "$GITHUB_OUTPUT"; fi
          else
            case "${{ github.event.schedule }}" in
              "33 7 * * 3"|"13 9 * * *") echo "job=ssb" >> "$GITHUB_OUTPUT" ;;
              "27 17 * * *") echo "job=daily" >> "$GITHUB_OUTPUT" ;;
              *) echo "job=prices" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Hent ${{ steps.pick.outputs.job }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
        working-directory: collectors
        run: python run.py ${{ steps.pick.outputs.job }} ${{ steps.pick.outputs.flags }}
