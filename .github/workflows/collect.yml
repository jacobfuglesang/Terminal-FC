name: Hent data

on:
  # Hovedtakten styres fra cron-job.org (workflow_dispatch):
  #   market  hvert 15. minutt 09–17:45 man–fre,  morning  06:35 hver dag (norsk tid).
  # Repoet er offentlig, så Actions-minutter er gratis. GitHub sin egen klokke er upålitelig,
  # men tar nyheter og varsler hver time døgnet rundt (også helg) som reserve.
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: ["collectors/**", ".github/workflows/collect.yml"]   # Kjør alt én gang når innsamlerne endres
  workflow_dispatch:
    inputs:
      job:
        description: "Jobb: market, daily, morning, all, eller enkeltjobber skilt med komma"
        type: string
        default: market
      backfill:
        description: "Hent lang historikk"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - run: pip install -r collectors/requirements.txt

      - name: Velg jobb
        id: pick
        env:
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "job=all" >> "$GITHUB_OUTPUT"
            echo "flags=--backfill" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="$INPUT_JOB"
            # Bare små bokstaver og komma, så ingen kan sende inn kommandoer via jobbnavnet
            if ! echo "$JOB" | grep -Eq '^[a-z,]{1,80}$'; then JOB=market; fi
            echo "job=$JOB" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.backfill }}" = "true" ]; then echo "flags=--backfill" >> "$GITHUB_OUTPUT"; fi
          else
            case "${{ github.event.schedule }}" in
              "35 5 * * *") echo "job=morning" >> "$GITHUB_OUTPUT" ;;
              *) echo "job=market" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Hent ${{ steps.pick.outputs.job }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        working-directory: collectors
        run: |
          set -o pipefail
          python -u run.py ${{ steps.pick.outputs.job }} ${{ steps.pick.outputs.flags }} 2>&1 | tee ../run.log

      # Ved kodeendringer: lagre loggen i grenen run-log, så den kan leses uten å logge inn på GitHub
      - name: Lagre logg
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/log && cp run.log /tmp/log/run.log 2>/dev/null || echo "ingen logg" > /tmp/log/run.log
          echo "${{ github.sha }} $(date -u)" > /tmp/log/meta.txt
          git config user.name "terminal-fc-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan run-log
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore 2>/dev/null || true
          cp /tmp/log/* .
          git add run.log meta.txt
          git commit -qm "logg [skip ci]"
          git push -f origin run-log
